<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Card 85×55 fronte — ValoreCasaTua.it</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,500&display=swap"></noscript>
<style>
@page{size:85mm 55mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:85mm;height:55mm;overflow:hidden}
body{font-family:"Hanken Grotesk",Arial,sans-serif;background:#0b1d2c;color:#fff;display:flex;flex-direction:column}
.main{flex:1;display:grid;grid-template-columns:1fr 30mm;gap:3.6mm;padding:4.2mm 5mm 2.2mm 5.2mm;min-height:0;align-items:start}
h1{font-size:5.15mm;font-weight:800;line-height:.98;letter-spacing:-.02em;text-transform:uppercase}
h1 span{color:#c9a45c}
.cta{margin-top:1.8mm;color:#c9a45c;font-size:2.45mm;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1.18}
.meta{margin-top:1.1mm;font-size:2.05mm;font-weight:600;line-height:1.2;color:rgba(255,255,255,.88)}
.sub{margin-top:1.6mm;font-size:2.25mm;line-height:1.28;font-weight:500;color:rgba(255,255,255,.92);max-width:17em}
.qrcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:0}
.qr{width:25mm;height:25mm;background:#fff;padding:1.2mm}
.qr img{width:100%;height:100%;display:block}
.url{margin-top:1.2mm;color:#c9a45c;font-size:2.05mm;font-weight:700;text-align:center;letter-spacing:-.015em}
.foot{background:#f4efe6;color:#0c2334;display:flex;align-items:center;justify-content:space-between;gap:3mm;padding:2.1mm 5mm 2.2mm 5.2mm;flex:none}
.logo{display:flex;align-items:center;gap:1.8mm}
.logo svg{width:6.4mm;height:6.4mm}
.logo span{font-family:"Playfair Display",Georgia,serif;font-size:3.5mm;font-weight:600;color:#0c2334;white-space:nowrap}
.logo em{font-style:normal;color:#8b6914}
.pay{font-size:2.2mm;line-height:1.25;color:#1a2e3b;text-align:right;font-weight:500}
</style>
</head>
<body>
  <div class="main">
    <div>
      <h1>Quanto<br>vale<br><span>oggi</span><br>la tua casa?</h1>
      <p class="cta">Calcola la<br>fascia gratuita</p>
      <p class="meta">Stima orientativa · senza lasciare i dati</p>
      <p class="sub">Potrebbe essere cambiato più di quanto pensi.</p>
    </div>
    <div class="qrcol">
      <div class="qr"><img src="../00-qr-stampa/qr-valuta-card.png" alt=""></div>
      <p class="url">valorecasatua.it/valuta</p>
    </div>
  </div>
  <div class="foot">
    <div class="logo">
      <svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><path d="M50 15.5 L16.5 45.5 L16.5 86 L83.5 86 L83.5 82.6" stroke="#0c2334" stroke-width="2.85"/><path d="M50 15.5 L67.42 31.1 L67.42 7.2 L74.12 7.2 L74.12 37.1 L83.5 45.5 L83.5 82.6" stroke="#c9a45c" stroke-width="2.85"/><path fill="#0c2334" d="M32.145 44.8H46.936V45.47H41.623L52.25 73.234L62.733 45.47H57.515V44.8H67.855V45.47H63.547L50.67 79.6H49.473L36.453 45.47H32.145Z"/></svg>
      <span>ValoreCasaTua<em>.it</em></span>
    </div>
    <p class="pay">Prima conosci il valore.<br>Poi decidi cosa fare.</p>
  </div>
</body>
</html>
