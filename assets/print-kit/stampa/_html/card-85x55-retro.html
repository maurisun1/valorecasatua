<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Card 85×55 retro — ValoreCasaTua.it</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,500&display=swap"></noscript>
<style>
@page{size:85mm 55mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:85mm;height:55mm;overflow:hidden}
body{font-family:"Hanken Grotesk",Arial,sans-serif;background:#f4efe6;color:#0c2334;display:flex;flex-direction:column;padding:4.6mm 5.4mm 2.8mm}
.row{flex:1;display:grid;grid-template-columns:1fr 29mm;gap:4mm;min-height:0}
.chips{display:flex;flex-direction:column;justify-content:center;gap:2.8mm}
.chip{display:flex;align-items:center;gap:2.4mm}
.chip svg{flex:none;width:5.2mm;height:5.2mm}
.chip span{font-size:3mm;font-weight:700;line-height:1.15}
.qrcol{display:flex;flex-direction:column;align-items:flex-end}
.qr{width:24.5mm;height:24.5mm;background:#fff;padding:1.2mm}
.qr img{width:100%;height:100%;display:block}
.url{margin-top:1.6mm;font-size:2.2mm;font-weight:700;color:#0c2334;text-align:right}
.wa{margin-top:3.2mm;padding-top:0}
.wa small{display:block;font-size:2.3mm;font-weight:600;margin-bottom:.6mm}
.wa b{display:block;font-size:3.5mm;font-weight:800;letter-spacing:-.01em;color:#0b1d2c}
.line{height:.25mm;background:#c9a45c;margin:2.6mm 0 2.2mm}
.foot{display:flex;align-items:center;justify-content:space-between;gap:3mm}
.logo{display:flex;align-items:center;gap:1.8mm}
.logo svg{width:6.2mm;height:6.2mm}
.logo span{font-family:"Playfair Display",Georgia,serif;font-size:3.5mm;font-weight:600}
.logo em{font-style:normal;color:#8b6914}
.pay{font-size:2.15mm;line-height:1.25;text-align:right;font-weight:500;color:#1a2e3b}
</style>
</head>
<body>
  <div class="row">
    <div>
      <div class="chips">
        <div class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="#8b6914" stroke-width="1.8"><rect x="3" y="12" width="4" height="8"/><rect x="10" y="8" width="4" height="12"/><rect x="17" y="4" width="4" height="16"/></svg>
          <span>Fascia di valore<br>orientativa</span>
        </div>
        <div class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="#8b6914" stroke-width="1.8"><path d="M12 21s7-7 7-12a7 7 0 1 0-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="9" r="2.2"/></svg>
          <span>Dati OMI<br>ufficiali</span>
        </div>
        <div class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="#8b6914" stroke-width="1.8"><path d="M12 3 4 6v6c0 5 3.4 8.4 8 10 4.6-1.6 8-5 8-10V6z"/><path d="m8.5 12 2.4 2.4 4.6-4.8"/></svg>
          <span>Decidi con più<br>informazioni</span>
        </div>
      </div>
      <div class="wa">
        <small>Scrivici su WhatsApp</small>
        <b>+39 351 629 2353</b>
      </div>
    </div>
    <div class="qrcol">
      <div class="qr"><img src="../00-qr-stampa/qr-valuta-card.png" alt=""></div>
      <p class="url">valorecasatua.it/valuta</p>
    </div>
  </div>
  <div class="line"></div>
  <div class="foot">
    <div class="logo">
      <svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><path d="M50 15.5 L16.5 45.5 L16.5 86 L83.5 86 L83.5 82.6" stroke="#0c2334" stroke-width="2.85"/><path d="M50 15.5 L67.42 31.1 L67.42 7.2 L74.12 7.2 L74.12 37.1 L83.5 45.5 L83.5 82.6" stroke="#c9a45c" stroke-width="2.85"/><path fill="#0c2334" d="M32.145 44.8H46.936V45.47H41.623L52.25 73.234L62.733 45.47H57.515V44.8H67.855V45.47H63.547L50.67 79.6H49.473L36.453 45.47H32.145Z"/></svg>
      <span>ValoreCasaTua<em>.it</em></span>
    </div>
    <p class="pay">Prima conosci il valore.<br>Poi decidi cosa fare.</p>
  </div>
</body>
</html>
