<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Anteprima kit stampa — ValoreCasaTua.it</title>
<style>
  :root{--navy:#0b1d2c;--cream:#f4efe6;--gold:#8b6914}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--navy);padding:32px 28px 80px}
  h1{font-size:28px;margin:0 0 8px}
  p.lead{margin:0 0 28px;opacity:.75}
  section{margin:0 0 40px}
  h2{font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
  figure{margin:0;background:#fff;border-radius:12px;padding:12px;box-shadow:0 8px 24px rgba(12,35,52,.08)}
  figure img{width:100%;height:auto;display:block;border-radius:6px;background:#ddd}
  figcaption{margin-top:10px;font-size:13px;opacity:.7}
  .wide{grid-column:1/-1;max-width:420px}
</style>
</head>
<body>
  <h1>Kit stampa ValoreCasaTua.it</h1>
  <p class="lead">Anteprima locale. I file sono nelle cartelle qui sotto. Apri questo file nel browser (doppio clic).</p>

  <section>
    <h2>00 · QR da stampare</h2>
    <div class="grid"><figure class="wide"><img src="00-qr-stampa/qr-valuta-print-300dpi.png" alt="QR"><figcaption>00-qr-stampa/qr-valuta-print-300dpi.png → valorecasatua.it/valuta</figcaption></figure></div>
  </section>
  <section>
    <h2>01 · Roll-up 85×200</h2>
    <div class="grid"><figure class="wide"><img src="01-rollup-85x200/rollup-85x200.jpg" alt="Roll-up"><figcaption>01-rollup-85x200/rollup-85x200.jpg</figcaption></figure></div>
  </section>
  <section>
    <h2>02 · Locandina 50×70</h2>
    <div class="grid"><figure class="wide"><img src="02-locandina-50x70/locandina-50x70.jpg" alt="Locandina"><figcaption>02-locandina-50x70/locandina-50x70.jpg</figcaption></figure></div>
  </section>
  <section>
    <h2>03 · Vetrofania</h2>
    <div class="grid"><figure class="wide"><img src="03-vetrofania/vetrofania.jpg" alt="Vetrofania"><figcaption>03-vetrofania/vetrofania.jpg</figcaption></figure></div>
  </section>
  <section>
    <h2>04 · Card da banco 10×15</h2>
    <div class="grid"><figure class="wide"><img src="04-card-banco-10x15/card-banco-10x15.jpg" alt="Card banco"><figcaption>04-card-banco-10x15/card-banco-10x15.jpg</figcaption></figure></div>
  </section>
  <section>
    <h2>05 · Card premium 85×55</h2>
    <div class="grid">
      <figure><img src="05-card-premium-85x55/card-premium-fronte.jpg" alt="Fronte"><figcaption>Fronte</figcaption></figure>
      <figure><img src="05-card-premium-85x55/card-premium-retro.jpg" alt="Retro"><figcaption>Retro</figcaption></figure>
    </div>
  </section>
  <section>
    <h2>06 · Flyer A5</h2>
    <div class="grid">
      <figure><img src="06-flyer-a5/flyer-a5-fronte.jpg" alt="Flyer fronte"><figcaption>Fronte</figcaption></figure>
      <figure><img src="06-flyer-a5/flyer-a5-retro.jpg" alt="Flyer retro"><figcaption>Retro</figcaption></figure>
    </div>
  </section>
</body>
</html>
