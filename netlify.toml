[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# URL puliti: la struttura a cartelle (es. verifica-casa/index.html) li serve nativamente.

# API -> Netlify Functions (motore Valutazione)
[[redirects]]
  from = "/api/anthropic"
  to = "/.netlify/functions/anthropic"
  status = 200
[[redirects]]
  from = "/api/geocode"
  to = "/.netlify/functions/geocode"
  status = 200
[[redirects]]
  from = "/api/valuation"
  to = "/.netlify/functions/valuation"
  status = 200
[[redirects]]
  from = "/api/maps-config"
  to = "/.netlify/functions/maps-config"
  status = 200
[[redirects]]
  from = "/api/places"
  to = "/.netlify/functions/places"
  status = 200

# www -> dominio principale (coerenza con i canonical non-www)
[[redirects]]
  from = "https://www.valorecasatua.it/*"
  to = "https://valorecasatua.it/:splat"
  status = 301
  force = true

# http www -> apex (evita hop intermedio su https www)
[[redirects]]
  from = "http://www.valorecasatua.it/*"
  to = "https://valorecasatua.it/:splat"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/og/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/valuta/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/home-hero-light.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/ai.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"
